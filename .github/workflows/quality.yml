name: CampusShelf checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: classroom-ci-only-947162
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      CAMPUSSHELF_TEST_PG_PASSWORD: classroom-ci-only-947162
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      Jwt__Key: ci-design-only-synthetic-secret-491827364918273649
      ConnectionStrings__Library: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=classroom-ci-only-947162
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: dotnet tool restore
      - run: dotnet build backend/CampusShelf.Api
      - run: dotnet ef migrations has-pending-model-changes --project backend/CampusShelf.Api
      - run: python scripts/integration_test.py
      - run: dotnet list backend/CampusShelf.Api package --vulnerable --include-transitive
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate
